[project]
name = "download-gguf"
version = "0.1.0"
description = "Download HuggingFace models and convert them to GGUF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub[hf_xet]>=1.0",
]

[project.scripts]
download-gguf = "download_gguf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["download_gguf"]
